[package]
name = "scanpy"
kind = "tool"
version = "1.12.4"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/scanpy"

[command]
name = "taf-scanpy"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/scanpy:1.12.4-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["single-cell", "transcriptomics", "Python", "scverse", "visualization"]
keywords = ["Scanpy", "scanpy", "single-cell", "scRNA-seq", "AnnData", "h5ad", "Leiden", "UMAP", "PCA"]
description = "Scanpy 1.12.4 CPU Python runtime and upstream CLI for scalable single-cell gene-expression analysis with AnnData, preprocessing, clustering, marker testing, and static plotting."

[upstream]
name = "Scanpy"
type = "github"
repo = "scverse/scanpy"
homepage = "https://scanpy.readthedocs.io/"
repository = "https://github.com/scverse/scanpy"
release_url = "https://github.com/scverse/scanpy/releases/tag/1.12.4"
downloads = "https://pypi.org/project/scanpy/1.12.4/; https://github.com/scverse/scanpy/archive/refs/tags/1.12.4.tar.gz"
version = "1.12.4"
license = "BSD-3-Clause"
citation = "Wolf, Angerer, and Theis. SCANPY: large-scale single-cell gene expression data analysis. Genome Biology 19, 15 (2018)."
doi = "10.1186/s13059-017-1382-0"
pmid = "29409532"
watch = "tags"

[smoke]
backend = "docker"
timeout = 300
exist = ["scanpy", "scanpy-prepare-datasets", "python", "python3", "pip", "bash", "sh"]
test = ["test \"$(python -c 'import importlib.metadata as md; print(md.version(\"scanpy\"))')\" = '1.12.4' && test \"$(python -c 'import importlib.metadata as md; print(md.version(\"scikit-misc\"))')\" = '0.5.2' && test \"$(python -c 'import importlib.metadata as md; print(md.version(\"openpyxl\"))')\" = '3.1.5' && test \"$(python -c 'import importlib.metadata as md; print(md.version(\"et-xmlfile\"))')\" = '2.0.0' && python -c 'import importlib.metadata as md; import scanpy as sc, anndata, et_xmlfile, fast_array_utils, h5py, igraph, leidenalg, matplotlib, natsort, networkx, numba, numpy, openpyxl, pandas, pynndescent, scipy, scverse_misc, seaborn, sklearn, statsmodels, umap; from skmisc.loess import loess; print(md.version(\"scanpy\"))' | grep -Fx '1.12.4' >/dev/null && scanpy --help 2>&1 | grep -E 'usage:|Usage:' >/dev/null && scanpy settings | grep -F 'TAFFISH_IMPLICIT_DATASET_DOWNLOADS_DISABLED' >/dev/null && grep -Fx 'upstream_commit=ff2133115f639fccce9633aa7f5309c36a0972e7' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'wheel_sha256=a12a7ca9500e4b247fbb5fb9318fb204907125e411183bad3e9c62e5b988f37c' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'scikit_misc_sdist_sha256=49fa30e4051b341edc7422db66a12c0f59d468729285bfe644d10924dc51be0a' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'openpyxl_wheel_sha256=5282c12b107bffeef825f4617dc029afaf41d0ea60823bbb665ef3079dc79de2' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'et_xmlfile_wheel_sha256=7a91720bc756843502c3b7504c77b8fe44217c85c537d85037f0f536151b2caa' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'dataset_catalog_sha256=7ec2711c801966b85eafae96857a166a70dbc8921a9094b627d65d9aad5f70fd' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'dataset_helper_sha256=f7bfd875c8f068d403206d6affec1ba0effd5b559799c9164bc31415b51596cd' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'dataset_policy_sha256=6a8cb1a52ee3973f43dce3135c7f4d291f64ea8c023c0b7205387b4c545f4eb4' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'smoke_script_sha256=77bcf120d3e64d0a306050b28c33f834befaa9bb78d7c0be4fdd82c824fc75fe' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && printf '%s  %s\\n' 'f7bfd875c8f068d403206d6affec1ba0effd5b559799c9164bc31415b51596cd' /opt/scanpy/bin/scanpy-prepare-datasets '6a8cb1a52ee3973f43dce3135c7f4d291f64ea8c023c0b7205387b4c545f4eb4' /opt/scanpy/lib/python3.12/site-packages/sitecustomize.py '77bcf120d3e64d0a306050b28c33f834befaa9bb78d7c0be4fdd82c824fc75fe' /opt/scanpy/share/testdata/scanpy_smoke.py | sha256sum -c - >/dev/null && grep -Fx 'dataset_policy=managed-v1 with persistent verified or explicit unverified roots' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && test -f /opt/scanpy/share/scanpy/TAFFISH_IMPLICIT_DATASET_DOWNLOADS_DISABLED && test ! -L /opt/scanpy/share/scanpy/TAFFISH_IMPLICIT_DATASET_DOWNLOADS_DISABLED && printf '%s  %s\n' '7ec2711c801966b85eafae96857a166a70dbc8921a9094b627d65d9aad5f70fd' /opt/scanpy/share/scanpy/dataset-catalog.json | sha256sum -c - >/dev/null && test -s /opt/scanpy/share/doc/scanpy/LICENSE.upstream && test -s /opt/scanpy/share/doc/scanpy/LICENSE.scikit-misc && test -s /opt/scanpy/share/doc/scanpy/LICENSE.scikit-misc-loess && test -s /opt/scanpy/share/doc/scanpy/LICENSE.openpyxl && test -s /opt/scanpy/share/doc/scanpy/LICENSE.et-xmlfile && test -s /opt/scanpy/share/doc/scanpy/LICENSE.et-xmlfile-python", "scanpy-prepare-datasets --list-datasets | grep -F 'pbmc3k-raw' >/dev/null && scanpy-prepare-datasets --dataset pbmc3k-raw --dry-run | grep -F 'pbmc3k-raw' >/dev/null && scanpy-prepare-datasets --dataset pbmc3k-raw --dry-run | grep -Fx 'required_free_bytes=53687091' >/dev/null && if scanpy-prepare-datasets --dataset pbmc3k-raw --min-free-gb nan --dry-run >/dev/null 2>&1; then exit 1; fi && if scanpy-prepare-datasets --dataset all --dry-run >/dev/null 2>&1; then exit 1; fi", "tmp=/tmp/taf-scanpy-regression-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; NUMBA_DISABLE_JIT=1 python /opt/scanpy/share/testdata/scanpy_smoke.py --regressions-only \"$tmp/out\" | grep -Fx 'regressions=ok' >/dev/null && rm -rf \"$tmp\"", "tmp=/tmp/taf-scanpy-workflow-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; python /opt/scanpy/share/testdata/scanpy_smoke.py \"$tmp/out\" && test -s \"$tmp/out/scanpy_smoke.h5ad\" && test -s \"$tmp/out/pca.png\" && test -s \"$tmp/out/markers.tsv\" && test -s \"$tmp/out/versions.tsv\" && grep -F 'gene' \"$tmp/out/markers.tsv\" >/dev/null && grep -F 'scanpy' \"$tmp/out/versions.tsv\" >/dev/null && grep -F 'openpyxl' \"$tmp/out/versions.tsv\" >/dev/null && grep -F 'et-xmlfile' \"$tmp/out/versions.tsv\" >/dev/null && rm -rf \"$tmp\"", "python /opt/scanpy/share/testdata/scanpy_smoke.py --policy-only | grep -Fx 'dataset_policy=fail-closed' >/dev/null"]
