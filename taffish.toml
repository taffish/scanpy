[package]
name = "scanpy"
kind = "tool"
version = "1.13.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/scanpy"

[command]
name = "taf-scanpy"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/scanpy:1.13.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["single-cell", "transcriptomics", "Python", "scverse", "visualization"]
keywords = ["Scanpy", "scanpy", "single-cell", "scRNA-seq", "AnnData", "h5ad", "Leiden", "UMAP", "PCA"]
description = "Scanpy 1.13.0 CPU Python runtime and upstream CLI for scalable single-cell gene-expression analysis with AnnData, preprocessing, clustering, marker testing, static plotting and optional standalone interactive HTML."

[upstream]
name = "Scanpy"
type = "github"
repo = "scverse/scanpy"
homepage = "https://scanpy.readthedocs.io/"
repository = "https://github.com/scverse/scanpy"
release_url = "https://github.com/scverse/scanpy/releases/tag/1.13.0"
downloads = "https://pypi.org/project/scanpy/1.13.0/; https://github.com/scverse/scanpy/archive/refs/tags/1.13.0.tar.gz"
version = "1.13.0"
license = "BSD-3-Clause"
citation = "Wolf, Angerer, and Theis. SCANPY: large-scale single-cell gene expression data analysis. Genome Biology 19, 15 (2018)."
doi = "10.1186/s13059-017-1382-0"
pmid = "29409532"
watch = "tags"

[smoke]
backend = "docker"
timeout = 300
exist = ["scanpy", "scanpy-prepare-datasets", "python", "python3", "pip", "bash", "sh"]
test = ["actual=\"$(python -c 'import importlib.metadata as md; print(md.version(\"scanpy\"))')\" && test \"$actual\" = '1.13.0' && actual=\"$(python -c 'import importlib.metadata as md; print(md.version(\"scikit-misc\"))')\" && test \"$actual\" = '0.5.2' && actual=\"$(python -c 'import importlib.metadata as md; print(md.version(\"openpyxl\"))')\" && test \"$actual\" = '3.1.5' && actual=\"$(python -c 'import importlib.metadata as md; print(md.version(\"et-xmlfile\"))')\" && test \"$actual\" = '2.0.0' && python -c 'import importlib.metadata as md; import scanpy as sc, anndata, et_xmlfile, fast_array_utils, h5py, igraph, leidenalg, matplotlib, natsort, networkx, numba, numpy, openpyxl, pandas, pynndescent, scipy, scverse_misc, seaborn, sklearn, statsmodels, umap; from skmisc.loess import loess; print(md.version(\"scanpy\"))' | grep -Fx '1.13.0' >/dev/null && scanpy --help 2>&1 | grep -E 'usage:|Usage:' >/dev/null && scanpy settings | grep -F 'TAFFISH_IMPLICIT_DATASET_DOWNLOADS_DISABLED' >/dev/null && grep -Fx 'upstream_commit=3962176e93ba148bc0f61443c517877d736f2b3b' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'wheel_sha256=1a93f9d2136f1441ae5dfd3fcdbc3d809f6f15cc6581ab7863cd17c5c4cdd22d' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'scikit_misc_sdist_sha256=49fa30e4051b341edc7422db66a12c0f59d468729285bfe644d10924dc51be0a' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'openpyxl_wheel_sha256=5282c12b107bffeef825f4617dc029afaf41d0ea60823bbb665ef3079dc79de2' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'et_xmlfile_wheel_sha256=7a91720bc756843502c3b7504c77b8fe44217c85c537d85037f0f536151b2caa' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'dataset_catalog_sha256=0ed3e3a3e7b04363ecaeb9943efdbc631ec2dd7f2585d249dd6a08824ae29887' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'dataset_helper_sha256=7ad57b8767724aa9a4042e34775e6c4fad9904ca8aa37e5ed52137c2f3df6420' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'dataset_policy_sha256=3599d39c7065b5a906540a62753b71b6a82e58c0b0dbaed4a6f39cb34406e28f' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'smoke_script_sha256=9c62900e8d3285bccb2cf30a5c1783598423d48c8f07af1a08d178cd947629e7' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && printf '%s  %s\\n' '7ad57b8767724aa9a4042e34775e6c4fad9904ca8aa37e5ed52137c2f3df6420' /opt/scanpy/bin/scanpy-prepare-datasets '3599d39c7065b5a906540a62753b71b6a82e58c0b0dbaed4a6f39cb34406e28f' /opt/scanpy/lib/python3.13/site-packages/sitecustomize.py '9c62900e8d3285bccb2cf30a5c1783598423d48c8f07af1a08d178cd947629e7' /opt/scanpy/share/testdata/scanpy_smoke.py | sha256sum -c - >/dev/null && grep -Fx 'dataset_policy=managed-v1 with persistent verified or explicit unverified roots' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && test -f /opt/scanpy/share/scanpy/TAFFISH_IMPLICIT_DATASET_DOWNLOADS_DISABLED && test ! -L /opt/scanpy/share/scanpy/TAFFISH_IMPLICIT_DATASET_DOWNLOADS_DISABLED && printf '%s  %s\n' '0ed3e3a3e7b04363ecaeb9943efdbc631ec2dd7f2585d249dd6a08824ae29887' /opt/scanpy/share/scanpy/dataset-catalog.json | sha256sum -c - >/dev/null && test -s /opt/scanpy/share/doc/scanpy/LICENSE.upstream && test -s /opt/scanpy/share/doc/scanpy/LICENSE.scikit-misc && test -s /opt/scanpy/share/doc/scanpy/LICENSE.scikit-misc-loess && test -s /opt/scanpy/share/doc/scanpy/LICENSE.openpyxl && test -s /opt/scanpy/share/doc/scanpy/LICENSE.et-xmlfile && test -s /opt/scanpy/share/doc/scanpy/LICENSE.et-xmlfile-python", "scanpy-prepare-datasets --list-datasets | grep -F 'pbmc3k-raw' >/dev/null && scanpy-prepare-datasets --dataset pbmc3k-raw --dry-run | grep -F 'pbmc3k-raw' >/dev/null && scanpy-prepare-datasets --dataset pbmc3k-raw --dry-run | grep -Fx 'required_free_bytes=53687091' >/dev/null && if scanpy-prepare-datasets --dataset pbmc3k-raw --min-free-gb nan --dry-run >/dev/null 2>&1; then exit 1; fi && if scanpy-prepare-datasets --dataset all --dry-run >/dev/null 2>&1; then exit 1; fi", "tmp=/tmp/taf-scanpy-regression-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; NUMBA_DISABLE_JIT=1 python /opt/scanpy/share/testdata/scanpy_smoke.py --regressions-only \"$tmp/out\" | grep -Fx 'regressions=ok' >/dev/null && rm -rf \"$tmp\"", "tmp=/tmp/taf-scanpy-workflow-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; python /opt/scanpy/share/testdata/scanpy_smoke.py \"$tmp/out\" && test -s \"$tmp/out/scanpy_smoke.h5ad\" && test -s \"$tmp/out/pca.png\" && test -s \"$tmp/out/pca-interactive.html\" && test -s \"$tmp/out/markers.tsv\" && test -s \"$tmp/out/versions.tsv\" && grep -F 'gene' \"$tmp/out/markers.tsv\" >/dev/null && grep -F 'scanpy' \"$tmp/out/versions.tsv\" >/dev/null && grep -F 'openpyxl' \"$tmp/out/versions.tsv\" >/dev/null && grep -F 'et-xmlfile' \"$tmp/out/versions.tsv\" >/dev/null && rm -rf \"$tmp\"", "python /opt/scanpy/share/testdata/scanpy_smoke.py --policy-only | grep -Fx 'dataset_policy=fail-closed' >/dev/null"]
