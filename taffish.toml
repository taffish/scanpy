[package]
name = "scanpy"
kind = "tool"
version = "1.12.3"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/scanpy"

[command]
name = "taf-scanpy"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/scanpy:1.12.3-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["single-cell", "transcriptomics", "Python", "scverse", "visualization"]
keywords = ["Scanpy", "scanpy", "single-cell", "scRNA-seq", "AnnData", "h5ad", "Leiden", "UMAP", "PCA"]
description = "Scanpy 1.12.3 Python runtime and upstream CLI for scalable single-cell gene-expression analysis with AnnData, preprocessing, clustering, marker testing, and plotting support."

[upstream]
name = "Scanpy"
type = "github"
repo = "scverse/scanpy"
homepage = "https://scanpy.readthedocs.io/"
repository = "https://github.com/scverse/scanpy"
release_url = "https://github.com/scverse/scanpy/releases/tag/1.12.3"
downloads = "https://pypi.org/project/scanpy/1.12.3/; https://github.com/scverse/scanpy/archive/refs/tags/1.12.3.tar.gz"
version = "1.12.3"
license = "BSD-3-Clause"
citation = "Wolf, Angerer, and Theis. SCANPY: large-scale single-cell gene expression data analysis. Genome Biology 19, 15 (2018)."
doi = "10.1186/s13059-017-1382-0"
pmid = "29409532"
watch = "tags"

[smoke]
backend = "docker"
timeout = 300
exist = ["scanpy", "python", "python3", "pip", "bash", "sh"]
test = ["test \"$(python -c 'import importlib.metadata as md; print(md.version(\"scanpy\"))')\" = '1.12.3' && python -c 'import importlib.metadata as md; import scanpy as sc, anndata, h5py, igraph, leidenalg, matplotlib, natsort, networkx, numba, numpy, pandas, pynndescent, scipy, seaborn, sklearn, statsmodels, umap; from skmisc.loess import loess; print(md.version(\"scanpy\"))' | grep -Fx '1.12.3' >/dev/null && scanpy --help 2>&1 | grep -E 'usage:|Usage:' >/dev/null && grep -Fx 'scanpy_version=1.12.3' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null && grep -Fx 'wheel_sha256=296bc35e243cb70f3aa948ca97237843fe0773f57aca3f66e6b37bf94b6e795d' /opt/scanpy/share/doc/scanpy/SOURCE >/dev/null", "tmp=/tmp/taf-scanpy-workflow-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; python /opt/scanpy/share/testdata/scanpy_smoke.py \"$tmp/out\" && test -s \"$tmp/out/scanpy_smoke.h5ad\" && test -s \"$tmp/out/pca.png\" && test -s \"$tmp/out/markers.tsv\" && test -s \"$tmp/out/versions.tsv\" && grep -F 'gene' \"$tmp/out/markers.tsv\" >/dev/null && grep -F 'scanpy' \"$tmp/out/versions.tsv\" >/dev/null && rm -rf \"$tmp\""]
